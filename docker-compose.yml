# Local Postgres only. Production should be AU-resident (Neon/Supabase Sydney).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wombat
      POSTGRES_PASSWORD: wombat
      POSTGRES_DB: brokerage
    ports:
      - "5432:5432"
    volumes:
      - brokerage_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wombat -d brokerage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brokerage_pg:

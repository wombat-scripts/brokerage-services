name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wombat
          POSTGRES_PASSWORD: wombat
          POSTGRES_DB: brokerage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wombat -d brokerage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wombat:wombat@localhost:5432/brokerage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @wombat/web build
